name = "emergency-voice-link"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"

[site]
bucket = "./dist"

[build.environment]
NODE_VERSION = "20"

# Required for Cloudflare Pages
[build.upload]
format = "directory"

# Specify the build output directory for Pages
build_output_dir = "dist"