name = "emergency-voice-link"
compatibility_date = "2024-01-01"

[build]
command = "npm install && npm run build"

# Specify the Pages build output directory
[site]
bucket = "./dist"
pages_build_output_dir = "dist"

[build.upload]
format = "service-worker"

[[routes]]
pattern = "/api/*"
script = "api"

[env.production]
workers_dev = true