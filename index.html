<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>911/999 Call Simulator | Teach Kids Emergency Safety (Free Tool)</title>
    <meta name="description" content="Free interactive 911/999 simulator for kids. Teach your child how to call emergency services safely with our realistic, AI-powered dispatcher training tool." />
    <meta name="author" content="Product-nomad" />

      Canonical URL is set per-request by src/components/SeoCanonical.tsx
      so 911callsimulator.com and 999callsimulator.com each self-canonicalise.
      Hreflang tags are also injected from there.
    -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="911/999 Call Simulator | Teach Kids Emergency Safety" />
    <meta property="og:description" content="Free interactive emergency-call simulator. Teach your child how to call 911 (US) or 999 (UK) safely, with an AI-powered dispatcher." />

    <meta property="og:site_name" content="911/999 Call Simulator" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="911/999 Call Simulator | Teach Kids Emergency Safety" />
    <meta name="twitter:description" content="Free interactive emergency-call simulator. Teach your child how to call 911 or 999 safely, with an AI-powered dispatcher." />
    <meta name="twitter:image" content="https://911callsimulator.com/og-image.png" />

    <!--
      Google Analytics + Google AdSense scripts are loaded by
      src/utils/consent.ts after the user grants consent via the
      cookie banner. They are deliberately NOT inlined here.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
